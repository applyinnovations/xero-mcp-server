apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: xero-mcp-pr-
  annotations:
    pipelinesascode.tekton.dev/on-event: '[pull_request]'
    pipelinesascode.tekton.dev/on-target-branch: '[main]'
    pipelinesascode.tekton.dev/target-namespace: tekton-buildkit
    pipelinesascode.tekton.dev/max-keep-runs: '5'
    pipelinesascode.tekton.dev/cancel-in-progress: 'true'
  labels:
    app.kubernetes.io/part-of: ci
    tekton.dev/pipeline: xero-mcp-pr
spec:
  params:
  - name: revision
    value: '{{ revision }}'
  taskRunTemplate:
    serviceAccountName: tekton-build-sa
    podTemplate:
      automountServiceAccountToken: false
      nodeSelector:
        storage.xlab.now/fast-local: 'true'
  taskRunSpecs:
  - pipelineTaskName: verify
    podTemplate:
      hostUsers: false
  timeouts:
    pipeline: 30m
  pipelineSpec:
    params:
    - name: revision
      type: string
    workspaces:
    - name: source
    - name: artifacts
    tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
        - {name: kind, value: task}
        - {name: name, value: git-clone-v1}
        - {name: namespace, value: tekton-pipelines}
      params:
      - name: url
        value: https://github.com/applyinnovations/xero-mcp-server
      - name: revision
        value: $(params.revision)
      - name: expectedCommitSha
        value: $(params.revision)
      - name: objectFilter
        value: none
      workspaces:
      - name: output
        workspace: source
    # Builds the Dockerfile exactly as images.yaml does; its build stage runs
    # npm run build, npm test and npm run lint. The archive is not published.
    - name: verify
      runAfter: [clone]
      taskRef:
        resolver: cluster
        params:
        - {name: kind, value: task}
        - {name: name, value: dockerfile-build-v1}
        - {name: namespace, value: tekton-buildkit}
      workspaces:
      - {name: source, workspace: source}
      - {name: artifacts, workspace: artifacts}
  workspaces:
  - name: source
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: fast-local
        resources:
          requests:
            storage: 2Gi
  - name: artifacts
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: fast-local
        resources:
          requests:
            storage: 2Gi
