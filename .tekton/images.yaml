apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: xero-mcp-images-
  annotations:
    pipelinesascode.tekton.dev/on-event: '[push]'
    pipelinesascode.tekton.dev/on-target-branch: '[main]'
    pipelinesascode.tekton.dev/target-namespace: tekton-buildkit
    pipelinesascode.tekton.dev/max-keep-runs: '5'
    pipelinesascode.tekton.dev/cancel-in-progress: 'true'
  labels:
    app.kubernetes.io/part-of: ci
    tekton.dev/pipeline: xero-mcp-images
spec:
  params:
  - name: revision
    value: '{{ revision }}'
  taskRunTemplate:
    serviceAccountName: tekton-build-sa
    podTemplate:
      automountServiceAccountToken: false
      nodeSelector:
        storage.xlab.now/fast-local: 'true'
  taskRunSpecs:
  - pipelineTaskName: build
    podTemplate:
      hostUsers: false
  timeouts:
    pipeline: 30m
  pipelineSpec:
    params:
    - name: revision
      type: string
    workspaces:
    - name: source
    - name: artifacts
    - name: docker-config
    tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
        - {name: kind, value: task}
        - {name: name, value: git-clone-v1}
        - {name: namespace, value: tekton-pipelines}
      params:
      - name: url
        value: https://github.com/applyinnovations/xero-mcp-server
      - name: revision
        value: $(params.revision)
      - name: expectedCommitSha
        value: $(params.revision)
      - name: objectFilter
        value: none
      workspaces:
      - name: output
        workspace: source
    # Builds the Dockerfile, whose build stage also runs the tests and lint.
    # No credentials here; the archive goes to publish.
    - name: build
      runAfter: [clone]
      taskRef:
        resolver: cluster
        params:
        - {name: kind, value: task}
        - {name: name, value: dockerfile-build-v1}
        - {name: namespace, value: tekton-buildkit}
      workspaces:
      - {name: source, workspace: source}
      - {name: artifacts, workspace: artifacts}
    - name: publish
      runAfter: [build]
      taskRef:
        resolver: cluster
        params:
        - {name: kind, value: task}
        - {name: name, value: oci-publish-v1}
        - {name: namespace, value: tekton-pipelines}
      params:
      - name: IMAGE
        value: registry.xlab.now/xero-mcp-server
      - name: COMMIT_SHA
        value: $(tasks.clone.results.COMMIT_SHA)
      - name: ARCHIVE_SHA256
        value: $(tasks.build.results.ARCHIVE_SHA256)
      workspaces:
      - {name: artifacts, workspace: artifacts}
      - {name: docker-config, workspace: docker-config}
    results:
    - name: IMAGE_DIGEST
      value: $(tasks.publish.results.IMAGE_DIGEST)
  workspaces:
  - name: source
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: fast-local
        resources:
          requests:
            storage: 2Gi
  - name: artifacts
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: fast-local
        resources:
          requests:
            storage: 2Gi
  - name: docker-config
    secret:
      secretName: registry-credentials
